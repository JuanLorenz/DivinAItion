<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>One Card Pull · Tarot Reading</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;1,600&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; background: #020524; color: #f1f5f9; font-family: "Plus Jakarta Sans", system-ui, sans-serif; }
    /* Nocturne Starfield Background — Pure CSS (Responsive & Seamless) */
    :root {
      --star-speed: 1;
      --star-trail-opacity: 1;
      --star-twinkle-intensity: 1;
    }

    .starfield-bg {
      position: fixed;
      inset: 0;
      z-index: -1;
      overflow: hidden;
      pointer-events: none;
      background:
        radial-gradient(ellipse 85% 45% at 50% 0%, rgba(16, 34, 118, 0.32) 0%, transparent 72%),
        radial-gradient(ellipse 90% 40% at 50% 100%, rgba(56, 18, 102, 0.38) 0%, transparent 75%),
        linear-gradient(
          180deg,
          #020836 0%,
          #030833 34%,
          #04041f 62%,
          #140632 84%,
          #210948 100%
        );
    }

    .starfield-layer {
      position: absolute;
      inset: 0;
    }

    /* 1. Top Falling Stars */
    .falling-star {
      position: absolute;
      top: 0;
      left: var(--x, 50%);
      width: var(--trail-w, 1.5px);
      height: var(--tail, 36vh);
      transform: translate3d(0, -110%, 0);
      opacity: 0;
      will-change: transform, opacity;
      animation: star-fall calc(var(--dur, 9.5s) / var(--star-speed)) linear infinite;
      animation-delay: calc(var(--delay, 0s) / var(--star-speed));
    }

    .falling-star__trail {
      position: absolute;
      inset: 0;
      border-radius: 999px;
      opacity: var(--star-trail-opacity);
      background: linear-gradient(
        to bottom,
        rgba(215, 224, 255, 0) 0%,
        rgba(215, 224, 255, 0.08) 38%,
        rgba(232, 236, 250, 0.34) 76%,
        var(--trail-tip, rgba(255, 252, 244, 0.78)) 100%
      );
    }

    .falling-star__head {
      position: absolute;
      bottom: 0;
      left: 50%;
      width: var(--head, 6px);
      height: var(--head, 6px);
      transform: translate(-50%, 50%);
      border-radius: 50%;
      background: radial-gradient(
        circle,
        #ffffff 0%,
        var(--tint, #eef2ff) 48%,
        transparent 76%
      );
      box-shadow:
        0 0 calc(var(--head, 6px) * 1.5) calc(var(--head, 6px) * 0.35) var(--glow, rgba(226, 232, 255, 0.72)),
        0 0 calc(var(--head, 6px) * 3.6) calc(var(--head, 6px) * 0.9) var(--halo, rgba(180, 198, 255, 0.28));
    }

    .falling-star__head::before,
    .falling-star__head::after {
      content: "";
      position: absolute;
      top: 50%;
      left: 50%;
      width: calc(var(--head, 6px) * 2.1);
      height: 1.5px;
      border-radius: 999px;
      background: radial-gradient(circle, rgba(255, 255, 255, 0.92) 0%, transparent 72%);
      transform: translate(-50%, -50%);
      opacity: 0.75;
    }

    .falling-star__head::after {
      transform: translate(-50%, -50%) rotate(90deg);
    }

    .falling-star--silver {
      --tint: #eef2ff;
      --trail-tip: rgba(235, 240, 255, 0.74);
      --glow: rgba(226, 233, 255, 0.72);
      --halo: rgba(176, 196, 255, 0.28);
    }

    .falling-star--ivory {
      --tint: #fff9ec;
      --trail-tip: rgba(255, 248, 232, 0.72);
      --glow: rgba(255, 244, 218, 0.68);
      --halo: rgba(242, 224, 185, 0.25);
    }

    .falling-star--champagne {
      --tint: #f8e9cc;
      --trail-tip: rgba(247, 230, 198, 0.72);
      --glow: rgba(245, 222, 178, 0.7);
      --halo: rgba(232, 198, 138, 0.26);
    }

    @keyframes star-fall {
      0% {
        transform: translate3d(0, calc(-100% - 2vh), 0);
        opacity: 0;
      }
      10% {
        opacity: var(--peak, 0.88);
      }
      42% {
        opacity: var(--peak, 0.88);
      }
      74% {
        opacity: calc(var(--peak, 0.88) * 0.42);
      }
      100% {
        transform: translate3d(0, calc(var(--fall, 58vh) - 100%), 0);
        opacity: 0;
      }
    }

    /* 2. Mid-Sky Faint Micro-Stars */
    .micro-star {
      position: absolute;
      left: var(--x);
      top: var(--y);
      width: var(--size, 2px);
      height: var(--size, 2px);
      border-radius: 50%;
      background: rgba(232, 234, 248, 0.85);
      opacity: var(--base-op, 0.25);
      will-change: opacity, transform;
      animation: micro-shimmer var(--dur, 6s) ease-in-out infinite;
      animation-delay: var(--delay, 0s);
    }

    @keyframes micro-shimmer {
      0%, 100% {
        opacity: calc(var(--base-op, 0.25) * 0.5);
        transform: scale(0.85);
      }
      50% {
        opacity: calc(var(--base-op, 0.25) * 1.25);
        transform: scale(1.1);
      }
    }

    /* 3. Bottom Subtle Twinkling 4-Point Astroid Stars */
    .twinkle-star {
      position: absolute;
      left: var(--x);
      bottom: var(--bottom);
      width: clamp(4px, calc(var(--size, 14px) * 0.82), var(--size, 14px));
      height: clamp(4px, calc(var(--size, 14px) * 0.82), var(--size, 14px));
      background: var(--color, #65547c);
      clip-path: polygon(
        50% 0%, 55% 32%, 60% 40%, 68% 45%,
        100% 50%, 68% 55%, 60% 60%, 55% 68%,
        50% 100%, 45% 68%, 40% 60%, 32% 55%,
        0% 50%, 32% 45%, 40% 40%, 45% 32%
      );
      opacity: var(--base-op, 0.72);
      will-change: opacity, transform;
      animation: star-twinkle var(--dur, 6s) ease-in-out infinite;
      animation-delay: var(--delay, 0s);
    }

    @keyframes star-twinkle {
      0%, 100% {
        opacity: max(0.08, calc(var(--base-op, 0.72) * (1 - 0.55 * var(--star-twinkle-intensity))));
        transform: scale(0.86);
      }
      50% {
        opacity: min(1, calc(var(--base-op, 0.72) * (1 + 0.28 * var(--star-twinkle-intensity))));
        transform: scale(calc(1 + 0.12 * var(--star-twinkle-intensity)));
      }
    }

    /* Responsive balance on small viewports */
    @media (max-width: 640px) {
      .star--desktop-only {
        display: none;
      }
      .falling-star__head {
        width: calc(var(--head, 6px) * 0.88);
        height: calc(var(--head, 6px) * 0.88);
      }
      .twinkle-star {
        width: calc(var(--size, 14px) * 0.72);
        height: calc(var(--size, 14px) * 0.72);
      }
    }

    /* Accessibility: honor reduced motion preference */
    @media (prefers-reduced-motion: reduce) {
      .falling-star {
        animation: none;
        transform: translate3d(0, calc(var(--fall, 50vh) * 0.72 - 100%), 0);
        opacity: calc(var(--peak, 0.85) * 0.8);
      }
      .twinkle-star,
      .micro-star {
        animation: none;
      }
    }

    .stage-backdrop { position: fixed; inset: 0; z-index: 2; pointer-events: none; overflow: hidden; }
    .curtain { position: absolute; top: 0; bottom: 0; width: 18vw; max-width: 230px; min-width: 68px; }
    .curtain--left { left: 0; }
    .curtain--right { right: 0; }
    .curtain svg, .velvet-table svg { display: block; width: 100%; height: 100%; }
    .velvet-table-wrap { position: absolute; left: 0; right: 0; bottom: 0; display: flex; justify-content: center; }
    .velvet-table { width: 92vw; max-width: 820px; height: 23vh; max-height: 210px; min-height: 120px; }

    .tarot-app { position: relative; z-index: 10; display: flex; flex-direction: column; width: 100%; height: 100dvh; }
    .tarot-stage { position: relative; flex: 1; display: flex; align-items: center; justify-content: center; overflow: hidden; padding: 24px 16px 112px; }
    .tarot-cards-origin { position: relative; width: 0; height: 0; z-index: 20; display: flex; align-items: center; justify-content: center; }

    .tarot-card {
      position: absolute;
      border: 0;
      padding: 0;
      background: transparent;
      border-radius: 9px;
      will-change: transform, opacity;
      user-select: none;
      perspective: 1100px;
    }
    .tarot-card.is-interactive { cursor: pointer; }
    .tarot-card.is-interactive:hover { filter: brightness(1.1); }
    .tarot-card.tarot-glide {
      transition: transform 760ms cubic-bezier(0.22, 1, 0.36, 1),
                  opacity 520ms ease,
                  filter 200ms ease,
                  box-shadow 260ms ease;
    }
    .tarot-card-inner {
      position: relative;
      width: 100%;
      height: 100%;
      transform-style: preserve-3d;
      transition: transform 720ms cubic-bezier(0.22, 1, 0.36, 1);
      border-radius: 9px;
      box-shadow: 0 14px 30px rgba(0, 0, 0, 0.82);
    }
    .tarot-card.is-flipped .tarot-card-inner { transform: rotateY(180deg); }
    .tarot-face {
      position: absolute;
      inset: 0;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      border-radius: 9px;
      overflow: hidden;
    }
    .tarot-face--front { transform: rotateY(180deg); }
    .tarot-face svg { display: block; width: 100%; height: 100%; }

    .tarot-card--singularity {
      pointer-events: none;
      opacity: 0;
      z-index: 30;
      box-shadow: 0 0 48px rgba(240, 192, 110, 0.45), 0 0 96px rgba(139, 92, 246, 0.35);
    }
    .tarot-card--singularity svg { display: block; width: 100%; height: 100%; }

    @keyframes subtleGlow {
      0%, 100% { box-shadow: 0 0 18px rgba(251, 191, 36, 0.45), 0 0 38px rgba(167, 139, 250, 0.25); }
      50% { box-shadow: 0 0 30px rgba(253, 224, 104, 0.78), 0 0 58px rgba(167, 139, 250, 0.45); }
    }
    .is-next-glow .tarot-card-inner { animation: subtleGlow 2.2s ease-in-out infinite; outline: 2px solid rgba(252, 211, 77, 0.8); }
    .is-active-card .tarot-card-inner { outline: 2px solid #fcd34d; box-shadow: 0 0 28px rgba(251, 191, 36, 0.5); }
    .is-arc-hover .tarot-card-inner { outline: 2px solid rgba(252, 211, 77, 0.8); box-shadow: 0 0 26px rgba(251, 191, 36, 0.65); }

    .vfx-altar, .vfx-ring, .vfx-core, .vfx-shockwave, .vfx-shockwave-inner { position: absolute; pointer-events: none; z-index: 5; }
    .vfx-altar > div { width: 100%; height: 100%; border-radius: 999px; background: radial-gradient(ellipse at center, rgba(167, 139, 250, 0.22) 0%, rgba(109, 40, 217, 0.12) 42%, transparent 72%); filter: blur(22px); }
    .vfx-ring { opacity: 0; }
    .vfx-ring .ring-outer { position: absolute; inset: 0; border-radius: 999px; border: 1px solid rgba(252, 211, 77, 0.25); box-shadow: 0 0 50px rgba(245, 196, 118, 0.12); }
    .vfx-ring .ring-mid { position: absolute; inset: 7%; border-radius: 999px; border: 1px dashed rgba(196, 181, 253, 0.3); }
    .vfx-ring .ring-inner { position: absolute; inset: 16%; border-radius: 999px; border: 1px solid rgba(253, 230, 138, 0.15); }
    .vfx-core { opacity: 0; }
    .vfx-core > div { width: 100%; height: 100%; border-radius: 999px; background: radial-gradient(circle, rgba(255, 245, 214, 0.88) 0%, rgba(232, 175, 92, 0.45) 28%, rgba(124, 58, 237, 0.28) 58%, transparent 76%); filter: blur(24px); }
    .vfx-shockwave { opacity: 0; border-radius: 999px; border: 2px solid rgba(253, 230, 138, 0.85); box-shadow: 0 0 40px rgba(251, 191, 36, 0.65); }
    .vfx-shockwave-inner { opacity: 0; border-radius: 999px; border: 1px solid rgba(221, 214, 254, 0.72); }
    .vfx-flash { position: fixed; inset: 0; z-index: 25; pointer-events: none; opacity: 0; background: radial-gradient(circle at center, rgba(255, 244, 214, 0.75) 0%, rgba(167, 139, 250, 0.25) 32%, transparent 68%); }

    /* Reading Layout & Frosted Explanation Box */
    .reading-layer {
      position: absolute;
      inset: 0;
      z-index: 15;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px 112px;
      pointer-events: none;
    }
    .reading-grid {
      display: grid;
      width: 100%;
      max-width: 1024px;
      align-items: center;
      gap: 20px;
      grid-template-columns: 1fr;
    }
    @media (min-width: 768px) {
      .reading-grid { grid-template-columns: minmax(250px, 340px) 1fr; gap: 44px; }
    }
    .left-anchor {
      margin: 0 auto;
      width: 100%;
      max-width: 260px;
      height: 175px;
    }
    @media (min-width: 768px) {
      .left-anchor { max-width: 340px; height: 310px; }
    }
    .explanation-col {
      display: flex;
      flex-direction: column;
      align-items: center;
      opacity: 0;
      transform: translateY(16px);
      pointer-events: none;
      transition: opacity 700ms ease, transform 700ms cubic-bezier(0.22, 1, 0.36, 1);
    }
    @media (min-width: 768px) {
      .explanation-col { align-items: flex-start; }
    }
    .explanation-col.is-visible {
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
    }
    .script-title {
      font-family: "Cormorant Garamond", Georgia, serif;
      font-style: italic;
      font-weight: 600;
      font-size: clamp(2rem, 4.5vw, 3.1rem);
      letter-spacing: 0.03em;
      color: #ecfa8c;
      text-shadow: 0 0 18px rgba(232, 248, 132, 0.55), 0 0 38px rgba(190, 225, 92, 0.28);
      text-align: center;
    }
    @media (min-width: 768px) { .script-title { text-align: left; } }

    .explain-box {
      margin-top: 14px;
      width: 100%;
      max-height: 42dvh;
      overflow-y: auto;
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      background: rgba(108, 107, 144, 0.46);
      backdrop-filter: blur(12px);
      padding: 20px 22px;
      box-shadow: 0 24px 50px rgba(0, 0, 0, 0.45);
      text-align: left;
    }
    @media (min-width: 768px) {
      .explain-box { max-height: none; overflow: visible; padding: 26px 28px; }
    }
    .explain-header {
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      justify-content: space-between;
      gap: 8px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.12);
      padding-bottom: 12px;
    }
    .explain-card-name {
      font-family: "Cormorant Garamond", Georgia, serif;
      font-size: clamp(1.45rem, 2.6vw, 1.95rem);
      font-weight: 600;
      color: #fef3c7;
    }
    .explain-archetype { font-size: 12px; font-weight: 500; color: rgba(224, 231, 255, 0.86); }
    .explain-keywords { margin-top: 10px; font-size: 12px; font-weight: 500; color: rgba(253, 230, 138, 0.92); }
    .explain-body { margin-top: 14px; font-size: 15px; line-height: 1.65; color: rgba(241, 245, 249, 0.95); }
    .explain-hint { margin-top: 12px; font-size: 12px; font-weight: 500; color: #fde68a; }
    .explain-actions { margin-top: 18px; padding-top: 14px; border-top: 1px solid rgba(255, 255, 255, 0.1); display: flex; flex-wrap: wrap; gap: 10px; }

    .tarot-controls { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); z-index: 40; display: flex; flex-direction: column; align-items: center; gap: 8px; }
    .tarot-status { font-size: 12px; color: rgba(203, 213, 225, 0.92); text-align: center; }
    .tarot-status strong { color: #fde68a; font-weight: 600; }
    .tarot-bar { display: flex; gap: 8px; padding: 6px; border-radius: 12px; border: 1px solid rgba(255, 255, 255, 0.12); background: rgba(7, 10, 38, 0.86); backdrop-filter: blur(12px); }
    .tarot-btn { min-height: 38px; padding: 8px 14px; border: 0; border-radius: 8px; font-size: 12px; font-weight: 600; cursor: pointer; white-space: nowrap; transition: background-color 150ms ease, opacity 150ms ease; }
    .tarot-btn--primary { background: #fbbf24; color: #020617; }
    .tarot-btn--primary:hover { background: #fcd34d; }
    .tarot-btn--indigo { background: #6366f1; color: #ffffff; }
    .tarot-btn--indigo:hover { background: #818cf8; }
    .tarot-btn--secondary { background: rgba(255, 255, 255, 0.1); color: #f1f5f9; border: 1px solid rgba(255, 255, 255, 0.14); }
    .tarot-btn--secondary:hover { background: rgba(255, 255, 255, 0.18); }
    .tarot-btn--ghost { background: transparent; color: #cbd5e1; }
    .tarot-btn--ghost:hover { background: rgba(255, 255, 255, 0.1); color: #ffffff; }
    .tarot-btn:disabled { opacity: 0.4; cursor: not-allowed; }

  </style>
</head>

    <div class="starfield-layer">
      <span class="falling-star falling-star--silver" style="--x:2.5%;--tail:38vh;--fall:52vh;--head:7px;--trail-w:1.5px;--dur:9.2s;--delay:-3.8s;--peak:0.92"><span class="falling-star__trail"></span><span class="falling-star__head"></span></span>
      <span class="falling-star falling-star--ivory star--desktop-only" style="--x:5.8%;--tail:34vh;--fall:48vh;--head:5.5px;--trail-w:1px;--dur:11.4s;--delay:-6.9s;--peak:0.72"><span class="falling-star__trail"></span><span class="falling-star__head"></span></span>
      <span class="falling-star falling-star--champagne" style="--x:8.2%;--tail:44vh;--fall:62vh;--head:6.5px;--trail-w:1.5px;--dur:8.6s;--delay:-5.4s;--peak:0.88"><span class="falling-star__trail"></span><span class="falling-star__head"></span></span>
      <span class="falling-star falling-star--silver" style="--x:13.5%;--tail:46vh;--fall:60vh;--head:6px;--trail-w:1.5px;--dur:10.2s;--delay:-4.6s;--peak:0.86"><span class="falling-star__trail"></span><span class="falling-star__head"></span></span>
      <span class="falling-star falling-star--ivory star--desktop-only" style="--x:16%;--tail:54vh;--fall:74vh;--head:5.5px;--trail-w:1px;--dur:12.1s;--delay:-8.3s;--peak:0.78"><span class="falling-star__trail"></span><span class="falling-star__head"></span></span>
      <span class="falling-star falling-star--silver" style="--x:19.2%;--tail:28vh;--fall:42vh;--head:5px;--trail-w:1px;--dur:9.8s;--delay:-2.9s;--peak:0.65"><span class="falling-star__trail"></span><span class="falling-star__head"></span></span>

      <span class="falling-star falling-star--silver" style="--x:26.2%;--tail:50vh;--fall:70vh;--head:6.5px;--trail-w:1.5px;--dur:10.6s;--delay:-6.7s;--peak:0.9"><span class="falling-star__trail"></span><span class="falling-star__head"></span></span>
      <span class="falling-star falling-star--champagne" style="--x:30.1%;--tail:36vh;--fall:50vh;--head:5.5px;--trail-w:1.5px;--dur:9.4s;--delay:-4.2s;--peak:0.82"><span class="falling-star__trail"></span><span class="falling-star__head"></span></span>
      <span class="falling-star falling-star--silver star--desktop-only" style="--x:33.2%;--tail:16vh;--fall:30vh;--head:5px;--trail-w:1px;--dur:7.4s;--delay:-1.6s;--peak:0.72"><span class="falling-star__trail"></span><span class="falling-star__head"></span></span>
      <span class="falling-star falling-star--ivory" style="--x:36.8%;--tail:48vh;--fall:64vh;--head:5px;--trail-w:1px;--dur:11.6s;--delay:-7.8s;--peak:0.76"><span class="falling-star__trail"></span><span class="falling-star__head"></span></span>
      <span class="falling-star falling-star--silver" style="--x:38.9%;--tail:38vh;--fall:55vh;--head:6.5px;--trail-w:1.5px;--dur:8.8s;--delay:-4.8s;--peak:0.9"><span class="falling-star__trail"></span><span class="falling-star__head"></span></span>
      <span class="falling-star falling-star--silver" style="--x:44.4%;--tail:14vh;--fall:28vh;--head:6px;--trail-w:1.5px;--dur:7.2s;--delay:-1.1s;--peak:0.92"><span class="falling-star__trail"></span><span class="falling-star__head"></span></span>
      <span class="falling-star falling-star--silver" style="--x:51%;--tail:46vh;--fall:66vh;--head:6.5px;--trail-w:1.5px;--dur:9.9s;--delay:-5.9s;--peak:0.88"><span class="falling-star__trail"></span><span class="falling-star__head"></span></span>

          y: (aRect.top + aRect.height / 2) - oy,
        };

        cardEls.forEach((el) => { el.style.width = cardW + 'px'; el.style.height = cardH + 'px'; });
        singularityCard.style.width = cardW + 'px';
        singularityCard.style.height = cardH + 'px';
        altarGlow.style.width = Math.round(380 * layoutScale) + 'px';
        altarGlow.style.height = Math.round(240 * layoutScale) + 'px';
        mandalaRing.style.width = Math.round(circleRadius * 2.18) + 'px';
        mandalaRing.style.height = Math.round(circleRadius * 2.18) + 'px';
        coreGlow.style.width = Math.round(280 * layoutScale) + 'px';
        coreGlow.style.height = Math.round(280 * layoutScale) + 'px';
        shockwaveOuter.style.width = Math.round(210 * layoutScale) + 'px';
        shockwaveOuter.style.height = Math.round(210 * layoutScale) + 'px';
        shockwaveInner.style.width = Math.round(180 * layoutScale) + 'px';
        shockwaveInner.style.height = Math.round(180 * layoutScale) + 'px';
        if (phase === 'idle') applyIdle();
        if (phase === 'reading') positionReadingCards();
      }

      function setStatus(title, sub) {
        statusReadout.innerHTML = '<strong>' + title + '</strong> · ' + sub;
      }

      function populateExplanation(card) {
        cardTitle.textContent = card.numeral + ' · ' + card.name;
        cardArchetype.textContent = card.archetype;
        cardKeywords.textContent = card.keywords.join(' · ');
        cardMeaning.textContent = card.oneCardMeaning;
        const topFront = cardEls[CARD_COUNT - 1].querySelector('[data-front]');
        topFront.innerHTML = createCardFaceSvg(card);
      }

      function positionReadingCards() {
        const deckZoom = isMobile ? 1.48 : 1.56;
        const topZoom = isMobile ? 1.58 : 1.66;
        cardEls.forEach((el, i) => {
          el.classList.add('tarot-glide');
          if (i < CARD_COUNT - 1) {
            const depth = CARD_COUNT - 1 - i;
            const tx = leftOffset.x + depth * 0.9;
            const ty = leftOffset.y + depth * 3.4 * layoutScale;
            el.style.transform = 'translate3d(' + tx.toFixed(1) + 'px, ' + ty.toFixed(1) + 'px, 0) rotate(0deg) scale(' + deckZoom + ')';
            el.style.opacity = i >= CARD_COUNT - 7 ? '1' : '0';
            el.style.zIndex = String(i + 2);
          } else {
            const ty = leftOffset.y - 10 * layoutScale;
            el.style.transform = 'translate3d(' + leftOffset.x.toFixed(1) + 'px, ' + ty.toFixed(1) + 'px, 0) rotate(0deg) scale(' + topZoom + ')';
            el.style.opacity = '1';
            el.style.zIndex = '40';
          }
        });
      }

      function openOneCardReading() {
        clearTimers();
        cancelAnimationFrame(rafId);
        phase = 'reading';
        setStatus('One Card Pull', 'Revealing your drawn card');

        // Clear all center singularity VFX & fused card immediately so nothing remains in the center
        altarGlow.style.opacity = '0';
        mandalaRing.style.opacity = '0';
        coreGlow.style.opacity = '0';
        shockwaveOuter.style.opacity = '0';
        shockwaveInner.style.opacity = '0';
        fusionFlash.style.opacity = '0';
        singularityCard.style.opacity = '0';
        singularityCard.style.visibility = 'hidden';
        singularityCard.style.transform = 'translate3d(0, 0, 0) scale(0.8)';

        currentCard = drawRandomCards(1)[0];
        populateExplanation(currentCard);
        cardEls.forEach((el, i) => {
          el.classList.add('tarot-glide');
          el.classList.remove('is-next-glow');
          if (i < CARD_COUNT - 1) el.classList.remove('is-interactive');
        });

        requestAnimationFrame(() => {
          measure();
          requestAnimationFrame(() => {
            positionReadingCards();
            timers.push(setTimeout(() => {
              cardEls[CARD_COUNT - 1].classList.add('is-flipped');
            }, 140));
            timers.push(setTimeout(() => {
              explanationCol.classList.add('is-visible');
            }, 420));
          });
        });
      }

      function drawAnotherCard() {
        const topCard = cardEls[CARD_COUNT - 1];
        topCard.classList.remove('is-flipped');
        explanationCol.classList.remove('is-visible');
        timers.push(setTimeout(() => {
          currentCard = drawRandomCards(1)[0];
          populateExplanation(currentCard);
          timers.push(setTimeout(() => {
            topCard.classList.add('is-flipped');
            timers.push(setTimeout(() => explanationCol.classList.add('is-visible'), 260));
          }, 90));
        }, 360));
      }

      function applyIdle() {
        clearTimers();
        cancelAnimationFrame(rafId);
        phase = 'idle';
        setStatus('Formation', CARD_COUNT + ' cards aligned · Click deck or Shuffle Cards');
        shuffleBtn.textContent = 'Shuffle Cards';
        resetBtn.disabled = true;
        explanationCol.classList.remove('is-visible');
        SLOTS.forEach((slot, i) => {
          const el = cardEls[i];
          el.classList.remove('tarot-glide', 'is-flipped', 'is-next-glow');
          el.classList.add('is-interactive');
          el.style.transform = 'translate3d(' + (slot.dx * layoutScale) + 'px, ' + (slot.dy * layoutScale) + 'px, 0) rotate(0deg) scale(1)';
          el.style.opacity = '1';
          el.style.zIndex = String(slot.z);
        });
        altarGlow.style.opacity = '1';
        altarGlow.style.transform = 'translateY(' + Math.round(118 * layoutScale) + 'px)';
        mandalaRing.style.opacity = '0';
        coreGlow.style.opacity = '0';
        shockwaveOuter.style.opacity = '0';
        shockwaveInner.style.opacity = '0';
        fusionFlash.style.opacity = '0';
        singularityCard.style.opacity = '0';
      }

      function startRitual() {
        clearTimers();
        cancelAnimationFrame(rafId);
        phase = 'shuffling';
        shuffleBtn.textContent = 'Replay Sequence';
        resetBtn.disabled = false;
        explanationCol.classList.remove('is-visible');
        singularityCard.style.opacity = '0';
        singularityCard.style.visibility = 'visible';
        cardEls.forEach((el) => el.classList.remove('tarot-glide', 'is-flipped', 'is-next-glow', 'is-interactive'));

        let lastTs = performance.now();
        let elapsed = 0;

        function tick(now) {
          const dt = Math.min((now - lastTs) / 1000, 0.05);
          lastTs = now;
          elapsed += dt;

          if (elapsed < T_SHUFFLE_END) {
            setStatus('Shuffling', 'Riffle weave across the night sky');
            const t = elapsed;
            const halfRank = Math.max(1, Math.floor(CARD_COUNT / 4));
            SLOTS.forEach((slot, i) => {
              const el = cardEls[i];
              const sx = slot.dx * layoutScale, sy = slot.dy * layoutScale;
              const side = i % 2 === 0 ? -1 : 1, rank = Math.floor(i / 2);
              let x = 0, y = 0, rot = 0, sc = 1, z = slot.z;
              if (t < 0.42) {
                const u = easeOutCubic(t / 0.42);
                x = sx + (side * (95 + (rank % 6) * 18) * layoutScale - sx) * u;
                y = sy + ((rank - halfRank) * Math.min(14, 70 / CARD_COUNT) * layoutScale - sy) * u;
                rot = side * (11 + (rank % 6) * 3.2) * u; sc = 1 + 0.04 * u; z = i + 2;
              } else if (t < 1.8) {
                const p = (t - 0.42) / 1.38;
                const env = Math.sin(Math.min(1, p * 1.15) * Math.PI * 0.5) * (1 - 0.25 * p);
                const wp = p * Math.PI * 3 + i * (3.12 / CARD_COUNT), sweep = Math.cos(wp);
                x = side * sweep * (128 + (i % 3) * 24) * layoutScale * (0.45 + 0.55 * env);
                y = Math.sin(wp * 2) * 28 * layoutScale + (rank - halfRank) * 4 * layoutScale * (1 - p);
                rot = side * sweep * 17; sc = 1.04 + 0.04 * Math.abs(Math.sin(wp));
                z = Math.round(CARD_COUNT * 0.6 + Math.sin(wp) * (CARD_COUNT * 0.5));
              } else {
                const u = easeInOutCubic((t - 1.8) / 0.45);
                const we = Math.PI * 3 + i * (3.12 / CARD_COUNT), se = Math.cos(we);
                const fx = side * se * (128 + (i % 3) * 24) * layoutScale * 0.86;
                const fy = Math.sin(we * 2) * 28 * layoutScale;
                x = fx * (1 - u) + (1 - u) * Math.sin(t * 48 + i * 1.7) * 2.5 * layoutScale;
                y = fy * (1 - u) + (i - MID) * 0.35 * (1 - u);
                rot = side * se * 17 * (1 - u) + (i - MID) * 0.7 * (1 - u);
                sc = 1.04 - 0.04 * u; z = i + 1;
              }
              el.style.transform = 'translate3d(' + x.toFixed(2) + 'px, ' + y.toFixed(2) + 'px, 0) rotate(' + rot.toFixed(2) + 'deg) scale(' + sc.toFixed(3) + ')';
              el.style.opacity = '1'; el.style.zIndex = String(z);
            });
            altarGlow.style.opacity = clamp01(1 - elapsed / 1.4).toFixed(3);
            const g = elapsed > 1.7 ? clamp01((elapsed - 1.7) / 0.55) : 0;
            coreGlow.style.opacity = (g * 0.55).toFixed(3);
            coreGlow.style.transform = 'scale(' + (0.35 + g * 0.35).toFixed(3) + ')';
          } else if (elapsed < T_CIRCLE_END) {
            if (phase !== 'circle') { phase = 'circle'; setStatus('Orbital Circle', 'Rotating celestial ring'); }
            const tau = elapsed - T_SHUFFLE_END;
            const bloomU = clamp01(tau / 0.85), r = circleRadius * easeOutQuint(bloomU);
            const theta = 0.35 * tau + 0.38 * tau * tau, rb = easeOutCubic(clamp01(tau / 0.5));
            SLOTS.forEach((_, i) => {
              const ang = (i / CARD_COUNT) * Math.PI * 2 - Math.PI / 2 + theta;
              const deg = ((ang * 180) / Math.PI + 90) * rb;
              cardEls[i].style.transform = 'translate3d(' + (r * Math.cos(ang)).toFixed(2) + 'px, ' + (r * Math.sin(ang)).toFixed(2) + 'px, 0) rotate(' + deg.toFixed(2) + 'deg) scale(1)';
              cardEls[i].style.opacity = '1'; cardEls[i].style.zIndex = String(i + 2);
            });
            mandalaRing.style.opacity = (easeOutCubic(clamp01(tau / 0.75)) * 0.85).toFixed(3);
            mandalaRing.style.transform = 'scale(' + (0.35 + 0.65 * easeOutQuint(bloomU)).toFixed(3) + ') rotate(' + (-(theta * 180) / Math.PI * 0.55).toFixed(2) + 'deg)';
            coreGlow.style.opacity = (0.42 + 0.14 * Math.sin(tau * 4)).toFixed(3);
          } else if (elapsed < T_CONVERGE_END) {
            if (phase !== 'converging') { phase = 'converging'; setStatus('Convergence', 'Spiraling into the singularity'); }
            const dur = T_CONVERGE_END - T_CIRCLE_END, s = clamp01((elapsed - T_CIRCLE_END) / dur);
            const cd = T_CIRCLE_END - T_SHUFFLE_END, t0 = 0.35 * cd + 0.38 * cd * cd, w0 = 0.35 + 0.76 * cd;
            const theta = t0 + dur * (w0 * s + 6.2 * Math.pow(s, 2.35));
            const r = circleRadius * (1 - easeInQuart(s)), sc = 1 - 0.16 * easeInQuad(s);
            const op = s > 0.9 ? clamp01(1 - (s - 0.9) / 0.1) : 1;
            SLOTS.forEach((_, i) => {
              const ang = (i / CARD_COUNT) * Math.PI * 2 - Math.PI / 2 + theta;
              const deg = (ang * 180) / Math.PI + 90;
              cardEls[i].style.transform = 'translate3d(' + (r * Math.cos(ang)).toFixed(2) + 'px, ' + (r * Math.sin(ang)).toFixed(2) + 'px, 0) rotate(' + deg.toFixed(2) + 'deg) scale(' + sc.toFixed(3) + ')';
              cardEls[i].style.opacity = op.toFixed(3);
            });
            mandalaRing.style.opacity = (0.85 * (1 - easeInQuad(s))).toFixed(3);
            mandalaRing.style.transform = 'scale(' + Math.max(0.05, 1 - 0.88 * easeInQuart(s)).toFixed(3) + ')';
            coreGlow.style.opacity = (0.5 + 0.5 * easeInQuad(s)).toFixed(3);
            coreGlow.style.transform = 'scale(' + (0.7 + 0.85 * easeInQuart(s)).toFixed(3) + ')';
          } else if (elapsed < T_SINGULARITY_END) {
            if (phase !== 'singularity') { phase = 'singularity'; setStatus('Singularity', 'All ' + CARD_COUNT + ' cards fused into one'); }
            const post = elapsed - T_CONVERGE_END;
            if (post < 0.1) cardEls.forEach((el) => { el.style.opacity = '0'; });
            mandalaRing.style.opacity = '0';
            const sw = clamp01(post / 1.05);
            shockwaveOuter.style.opacity = (sw < 1 ? (1 - sw) * 0.92 : 0).toFixed(3);
            shockwaveOuter.style.transform = 'scale(' + (0.15 + 3.1 * easeOutQuint(sw)).toFixed(3) + ')';
            const sw2 = clamp01((post - 0.08) / 0.85);
            shockwaveInner.style.opacity = (post > 0.08 && sw2 < 1 ? (1 - sw2) * 0.75 : 0).toFixed(3);
            shockwaveInner.style.transform = 'scale(' + (0.12 + 2.2 * easeOutCubic(sw2)).toFixed(3) + ')';
            const fl = clamp01(post / 0.55);
            fusionFlash.style.opacity = (fl < 1 ? Math.pow(1 - fl, 2) * 0.85 : 0).toFixed(3);
            const em = easeOutQuint(clamp01(post / 0.45));
            singularityCard.style.opacity = em.toFixed(3);
            singularityCard.style.transform = 'translate3d(0, ' + (Math.sin(post * 2.2) * 5 * layoutScale).toFixed(2) + 'px, 0) scale(' + (0.72 + 0.50 * em).toFixed(3) + ')';
          } else {
            if (phase !== 'deck') {
              phase = 'deck';
              setStatus('Deck Ready', 'Click the glowing deck to pull your card');
              cardEls.forEach((el, i) => {
                el.classList.add('is-interactive');
                if (i === CARD_COUNT - 1) el.classList.add('is-next-glow');
              });
            }
            const pd = elapsed - T_SINGULARITY_END;
            shockwaveOuter.style.opacity = '0';
            shockwaveInner.style.opacity = '0';
            fusionFlash.style.opacity = '0';
            singularityCard.style.opacity = clamp01(1 - pd / 0.32).toFixed(3);
            const cf = easeOutCubic(clamp01(pd / 0.85));
            coreGlow.style.opacity = (0.75 * (1 - cf) + 0.24 * cf).toFixed(3);
            coreGlow.style.transform = 'scale(' + (1.15 - 0.25 * cf).toFixed(3) + ')';

            SLOTS.forEach((_, i) => {
              const d = i * STAGGER_DELAY;
              const u = easeOutQuint(clamp01((pd - d) / 0.56));
              const ap = clamp01((pd - d * 0.5) / 0.18);
              const pose = getStackedPose(i, CARD_COUNT, layoutScale);
              const x = pose.x * u;
              const y = (-18 * layoutScale) * (1 - u) + pose.y * u;
              const rot = pose.rot * u;
              cardEls[i].style.transform = 'translate3d(' + x.toFixed(2) + 'px, ' + y.toFixed(2) + 'px, 0) rotate(' + rot.toFixed(2) + 'deg) scale(' + (1.22 - 0.16 * u).toFixed(3) + ')';
              cardEls[i].style.opacity = ap.toFixed(3);
              cardEls[i].style.zIndex = String(pose.z);
            });

            if (pd > 1.15) return; // Deck settled; wait for deck click
          }

          rafId = requestAnimationFrame(tick);
        }

        rafId = requestAnimationFrame(tick);
      }

      shuffleBtn.addEventListener('click', startRitual);
      resetBtn.addEventListener('click', applyIdle);
      drawAnotherBtn.addEventListener('click', drawAnotherCard);
      reshuffleBtn.addEventListener('click', startRitual);
      formationBtn.addEventListener('click', applyIdle);
      window.addEventListener('resize', measure);
      if (window.ResizeObserver) new ResizeObserver(measure).observe(stage);
      measure();
    })();
  </script>
</body>
</html>
