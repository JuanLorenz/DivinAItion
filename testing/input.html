<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DivinAItion</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <!-- <link rel="stylesheet" href="styles.css" /> -->
     <style>
        :root {
         --bg: #0b0e1a;
         --card-bg: #14192d;
         --border: rgba(226, 185, 111, 0.28);
         --gold: #e2b96f;
         --gold-soft: rgba(226, 185, 111, 0.14);
         --text: #f3f4f6;
         --muted: #9ca3af;
         }
         
         * {
         box-sizing: border-box;
         margin: 0;
         padding: 0;
         }
         
         body {
         min-height: 100vh;
         display: flex;
         align-items: center;
         justify-content: center;
         padding: 1.5rem;
         font-family: "Inter", sans-serif;
         color: var(--text);
         background: radial-gradient(circle at top, #1d2342 0%, var(--bg) 75%);
         }
         
         .card {
         width: 100%;
         max-width: 480px;
         padding: 2rem;
         border-radius: 18px;
         background: var(--card-bg);
         border: 1px solid var(--border);
         box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
         }
         
         .title {
         font-family: "Cinzel", serif;
         font-size: 1.7rem;
         text-align: center;
         color: var(--gold);
         margin-bottom: 0.4rem;
         }
         
         .subtitle {
         text-align: center;
         font-size: 0.92rem;
         color: var(--muted);
         margin-bottom: 1.6rem;
         }
         
         .reading-form {
         display: flex;
         flex-direction: column;
         gap: 1.35rem;
         }
         
         .form-group {
         display: flex;
         flex-direction: column;
         gap: 0.5rem;
         }
         
         .label {
         font-size: 0.82rem;
         font-weight: 600;
         text-transform: uppercase;
         letter-spacing: 0.06em;
         color: var(--gold);
         }
         
         input[type="date"] {
         width: 100%;
         padding: 0.8rem 0.95rem;
         border-radius: 10px;
         border: 1px solid rgba(255, 255, 255, 0.15);
         background: #0d1020;
         color: var(--text);
         font-family: inherit;
         font-size: 0.95rem;
         color-scheme: dark;
         outline: none;
         transition: border-color 0.2s ease;
         }
         
         input[type="date"]:focus {
         border-color: var(--gold);
         }
         
         .zodiac-display {
         padding: 0.65rem 0.9rem;
         border-radius: 10px;
         background: var(--gold-soft);
         border: 1px solid rgba(226, 185, 111, 0.35);
         font-size: 0.9rem;
         }
         
         .zodiac-display strong {
         color: #fff3d1;
         }
         
         /* Reading Options */
         .reading-options {
         display: flex;
         flex-direction: column;
         gap: 0.55rem;
         }
         
         .reading-option {
         cursor: pointer;
         }
         
         .reading-option input {
         position: absolute;
         opacity: 0;
         pointer-events: none;
         }
         
         .option-box {
         display: block;
         padding: 0.8rem 1rem;
         border-radius: 10px;
         background: #0d1020;
         border: 1px solid rgba(255, 255, 255, 0.12);
         font-size: 0.95rem;
         font-weight: 500;
         transition: border-color 0.2s ease, background 0.2s ease, transform 0.15s ease;
         }
         
         .reading-option:hover .option-box {
         border-color: rgba(226, 185, 111, 0.6);
         background: rgba(226, 185, 111, 0.08);
         transform: translateX(3px);
         }
         
         .reading-option input:checked + .option-box {
         border-color: var(--gold);
         background: var(--gold-soft);
         color: #fff6df;
         font-weight: 600;
         }
         
         /* Meaning Box */
         .reading-meaning {
         margin-top: 0.25rem;
         padding: 0.85rem 1rem;
         border-radius: 10px;
         background: rgba(255, 255, 255, 0.04);
         border-left: 3px solid var(--gold);
         font-size: 0.88rem;
         line-height: 1.45;
         color: #e5e7eb;
         }
         
         /* Submit Button */
         .submit-btn {
         margin-top: 0.25rem;
         padding: 0.9rem;
         border: none;
         border-radius: 10px;
         background: linear-gradient(135deg, #f0d08a, #d29c45);
         color: #14120c;
         font-size: 1rem;
         font-weight: 700;
         cursor: pointer;
         transition: opacity 0.2s ease, transform 0.15s ease;
         }
         
         .submit-btn:hover {
         opacity: 0.92;
         transform: translateY(-1px);
         }
         
         .submit-message {
         margin-top: 1.25rem;
         padding: 0.9rem 1rem;
         border-radius: 10px;
         background: rgba(226, 185, 111, 0.12);
         border: 1px solid rgba(226, 185, 111, 0.4);
         font-size: 0.9rem;
         line-height: 1.5;
         }
         
         .current-time {
         margin-top: 1.25rem;
         text-align: center;
         font-size: 0.78rem;
         color: var(--muted);
         }
         
         .hidden {
         display: none;
         }
     </style>
  </head>
  <body>
    <main class="card">
      <h1 class="title">Welcome to DivinAItion!</h1>
      <p class="subtitle">Enter your birth date and pick a reading</p>

      <form id="readingForm" class="reading-form">
        <!-- Birthdate Input + Derived Astrology Sign -->
        <div class="form-group">
          <label for="birthdate" class="label">Birth Date</label>
          <input type="date" id="birthdate" name="birthdate" required />

          <div id="zodiacDisplay" class="zodiac-display hidden">
            Your Astrology Sign: <strong id="zodiacText"></strong>
          </div>
        </div>

        <!-- Card Reading Options -->
        <div class="form-group">
          <span class="label">Choose a Card Reading</span>

          <div class="reading-options" role="radiogroup" aria-label="Card Reading Options">
            <label class="reading-option" data-reading="one-card">
              <input type="radio" name="reading" value="One-Card Pull" required />
              <span class="option-box">One-Card Pull</span>
            </label>

            <label class="reading-option" data-reading="three-card">
              <input type="radio" name="reading" value="Three-Card Spread" />
              <span class="option-box">Three-Card Spread</span>
            </label>

            <label class="reading-option" data-reading="celtic-cross">
              <input type="radio" name="reading" value="Celtic Cross Spread" />
              <span class="option-box">Celtic Cross Spread</span>
            </label>
          </div>

          <!-- Displays what the hovered or clicked reading means -->
          <div id="readingMeaning" class="reading-meaning">
            Hover over or click a reading option to see what it means.
          </div>
        </div>

        <button type="submit" class="submit-btn">Submit</button>
      </form>

      <!-- Form submission confirmation -->
      <div id="submitMessage" class="submit-message hidden"></div>

      <p id="currentTime" class="current-time"></p>
    </main>

    <script>
        const zodiacDisplay = document.getElementById("zodiacDisplay");
        const zodiacText = document.getElementById("zodiacText");
        
        const readingOptions = document.querySelectorAll(".reading-option");
        const readingMeaning = document.getElementById("readingMeaning");
        const readingForm = document.getElementById("readingForm");
        const submitMessage = document.getElementById("submitMessage");
        const currentTimeEl = document.getElementById("currentTime");
        
        const READING_DESCRIPTIONS = {
          "one-card": "One-Card Pull – Draws one random card for a quick reflection.",
          "three-card": "Three-Card Spread – Draws three cards representing Past, Present, and Future.",
          "celtic-cross": "Celtic Cross Spread – Draws ten cards for a more detailed reading."
        };
        
        // 1. Calculate Astrology Sign from Birthdate
        function getAstrologySign(month, day) {
          if ((month === 12 && day >= 22) || (month === 1 && day <= 19)) return "♑ Capricorn";
          if ((month === 1 && day >= 20) || (month === 2 && day <= 18)) return "♒ Aquarius";
          if ((month === 2 && day >= 19) || (month === 3 && day <= 20)) return "♓ Pisces";
          if ((month === 3 && day >= 21) || (month === 4 && day <= 19)) return "♈ Aries";
          if ((month === 4 && day >= 20) || (month === 5 && day <= 20)) return "♉ Taurus";
          if ((month === 5 && day >= 21) || (month === 6 && day <= 20)) return "♊ Gemini";
          if ((month === 6 && day >= 21) || (month === 7 && day <= 22)) return "♋ Cancer";
          if ((month === 7 && day >= 23) || (month === 8 && day <= 22)) return "♌ Leo";
          if ((month === 8 && day >= 23) || (month === 9 && day <= 22)) return "♍ Virgo";
          if ((month === 9 && day >= 23) || (month === 10 && day <= 22)) return "♎ Libra";
          if ((month === 10 && day >= 23) || (month === 11 && day <= 21)) return "♏ Scorpio";
          return "♐ Sagittarius";
        }
        
        function updateSign() {
          if (!birthdateInput.value) {
            zodiacDisplay.classList.add("hidden");
            return null;
          }
        
          const [, monthStr, dayStr] = birthdateInput.value.split("-");
          const sign = getAstrologySign(parseInt(monthStr, 10), parseInt(dayStr, 10));
        
          zodiacText.textContent = sign;
          zodiacDisplay.classList.remove("hidden");
          return sign;
        }
        
        birthdateInput.addEventListener("input", updateSign);
        
        // 2. Show what the reading means on hover or click
        function showSelectedMeaning() {
          const checked = document.querySelector('input[name="reading"]:checked');
          if (!checked) {
            readingMeaning.textContent = "Hover over or click a reading option to see what it means.";
            return;
          }
          const key = checked.closest(".reading-option").dataset.reading;
          readingMeaning.textContent = READING_DESCRIPTIONS[key];
        }
        
        readingOptions.forEach((option) => {
          const key = option.dataset.reading;
          const radio = option.querySelector("input");
        
          // Hovering previews the meaning
          option.addEventListener("mouseenter", () => {
            readingMeaning.textContent = READING_DESCRIPTIONS[key];
          });
        
          // Leaving reverts to whichever option is currently clicked/selected
          option.addEventListener("mouseleave", showSelectedMeaning);
        
          // Clicking selects the option and keeps its meaning displayed
          radio.addEventListener("change", () => {
            readingMeaning.textContent = READING_DESCRIPTIONS[key];
          });
        });
        
        // 3. Submit button handler
        readingForm.addEventListener("submit", (e) => {
          e.preventDefault();
        
          const sign = updateSign();
          const selected = document.querySelector('input[name="reading"]:checked');
          if (!sign || !selected) return;
        
          submitMessage.innerHTML = `
            <strong>Submitted!</strong><br />
            Birth Date: ${birthdateInput.value} (${sign})<br />
            Selected Reading: ${selected.value}
          `;
          submitMessage.classList.remove("hidden");
        
          // Add your navigation or next-step logic here
        });
        
        // 4. Current Time
        function showTime() {
          currentTimeEl.textContent = new Date().toLocaleString();
        }
        showTime();
        setInterval(showTime, 1000);
        const birthdateInput = document.getElementById("birthdate");
    </script>
  </body>
</html>
