<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Celtic Cross Spread · DivinAItion</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;1,600&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>
  <div id="starfieldMount"><!--__BACKGROUND_ANIMATION__--></div>

  <div class="tarot-app">
    <main class="tarot-stage is-click-to-shuffle" id="tarotStage">
      <div class="vfx-altar" id="altarGlow"><div></div></div>
      <div class="vfx-ring" id="mandalaRing"><div class="ring-outer"></div><div class="ring-mid"></div><div class="ring-inner"></div></div>
      <div class="vfx-core" id="coreGlow"><div></div></div>
      <div class="vfx-shockwave" id="shockwaveOuter"></div>
      <div class="vfx-shockwave-inner" id="shockwaveInner"></div>
      <div class="vfx-flash" id="fusionFlash"></div>

      <div class="celtic-prompt" id="celticPrompt">
        <p id="celticPromptText">Click the glowing <strong>I. Present</strong> card at the heart of the cross</p>
      </div>

      <div class="reading-layer">
        <div class="celtic-grid">
          <div class="celtic-left-anchor" id="leftAnchor" aria-hidden="true"></div>
          <div class="explanation-col" id="explanationCol">
            <h1 class="script-title">Celtic Cross Spread</h1>
            <div class="explain-box">
              <div class="explain-header" style="align-items:center;">
                <div class="pos-num-tabs" id="posNumTabs"></div>
                <button type="button" class="tarot-btn tarot-btn--indigo" id="summaryBtn" style="display:none;">Summary</button>
              </div>
              <div id="explainContent"></div>
            </div>
          </div>
        </div>
      </div>

      <div class="summary-layer">
        <div class="summary-wrap" id="summaryWrap">
          <h1 class="script-title" style="text-align:center;">Celtic Cross Spread</h1>
          <div class="summary-box">
            <div class="explain-header" style="align-items:center;">
              <h2 class="explain-card-name">Complete Reading Summary</h2>
              <button type="button" class="tarot-btn tarot-btn--primary" id="backToCrossBtn">Back to Celtic Cross</button>
            </div>
            <div class="explain-body" id="summaryBody"></div>
            <div class="summary-10-grid" id="summaryCardsGrid"></div>
          </div>
        </div>
      </div>

      <div class="tarot-cards-origin" id="cardsOrigin">
        <div class="tarot-card tarot-card--singularity" id="singularityCard" aria-hidden="true"></div>
      </div>
    </main>
  </div>

  <script>
    (function () {
      const CARD_COUNT = 78;
      const CELTIC_CROSS_POSITIONS = [
        { numeral: 'I', label: 'Present', subtitle: 'Heart of the Matter' },
        { numeral: 'II', label: 'Challenge', subtitle: 'Crossing Influence' },
        { numeral: 'III', label: 'Foundation', subtitle: 'Subconscious Roots' },
        { numeral: 'IV', label: 'Recent Past', subtitle: 'Passing Influence' },
        { numeral: 'V', label: 'Crowning', subtitle: 'Conscious Goal' },
        { numeral: 'VI', label: 'Near Future', subtitle: 'Approaching Path' },
        { numeral: 'VII', label: 'Self', subtitle: 'Inner Attitude' },
        { numeral: 'VIII', label: 'Environment', subtitle: 'External Forces' },
        { numeral: 'IX', label: 'Hopes & Fears', subtitle: 'Hidden Expectations' },
        { numeral: 'X', label: 'Outcome', subtitle: 'Final Culmination' }
      ];

      // Static PNG folders correlated to Supabase primary key (0.png .. 77.png) & card back
      const CARD_IMAGE_BASE_PATH = '/app/static/images/card/';
      const CARD_BACK_REL_PATH = 'images/miscellaneous/TarotCard_Back.png';

      // Python injects either:
      // 1) { "cards": celtic_cross(), "llm_response": "Para 1\n\nPara 2\n\n...Para 10", "card_back_url": "data:image/png;base64,..." }
      // 2) celtic_cross() list directly where each card includes "llm_interpretation" (or "interpretation" / "meaning")
      const RAW_INJECTED_DATA = /*__TAROT_DATA__*/ null;
      let extraSummaryParagraphs = [];

      function loadBackgroundAnimation() {
        const mount = document.getElementById('starfieldMount');
        if (!mount || mount.querySelector('.starfield-bg')) return;
        const paths = [
          'background_animation.html',
          '/app/static/templates/background_animation.html',
          '/static/templates/background_animation.html',
          'static/templates/background_animation.html',
        ];
        (function tryNext(idx) {
          if (idx >= paths.length) return;
          fetch(paths[idx])
            .then((res) => (res.ok ? res.text() : Promise.reject(new Error('HTTP ' + res.status))))
            .then((html) => { mount.innerHTML = html; })
            .catch(() => tryNext(idx + 1));
        })(0);
      }

      function splitLlmParagraphs(raw, expectedCount) {
        if (!raw) return [];
        if (Array.isArray(raw)) {
          return raw.map((p) => String(p || '').trim()).filter(Boolean);
        }
        const text = String(raw).replace(/\r\n/g, '\n').trim();
        if (!text) return [];
        const byBlank = text.split(/\n\s*\n+/).map((p) => p.trim()).filter(Boolean);
        if (byBlank.length >= (expectedCount || 1)) return byBlank;
        const byLine = text.split(/\n+/).map((p) => p.trim()).filter(Boolean);
        return byLine.length > byBlank.length ? byLine : byBlank;
      }

      function formatInlineText(str) {
        return escapeHtml(str)
          .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
          .replace(/\*(.+?)\*/g, '<em>$1</em>');
      }

      function renderParagraphsHtml(text) {
        const paras = Array.isArray(text) ? text : splitLlmParagraphs(text, 1);
        if (!paras.length) return '';
        return paras.map((p) => '<p>' + formatInlineText(p) + '</p>').join('');
      }

      function normalizeCard(raw, llmParagraph) {
        const isRev = Boolean(raw && raw.is_reverse);
        const dbMeaning = raw && (raw.meaning || (isRev ? (raw.reversed_meaning || raw.reversed_additional) : (raw.upright_meaning || raw.upright_additional))) || '';
        const llmText = (raw && (raw.llm_interpretation || raw.interpretation || raw.llm_explanation || raw.explanation)) || llmParagraph || dbMeaning;
        return {
          id: raw && raw.id != null ? raw.id : 0,
          card_name: (raw && raw.card_name) || ('Card #' + (raw && raw.id != null ? raw.id : 0)),
          is_reverse: isRev,
          arcana: (raw && raw.arcana) || '',
          suit: (raw && raw.suit) || '',
          meaning: llmText,
          image_url: raw && raw.image_url,
        };
      }

      function getDrawnTen() {
        extraSummaryParagraphs = [];
        if (RAW_INJECTED_DATA && typeof RAW_INJECTED_DATA === 'object') {
          const rawCards = Array.isArray(RAW_INJECTED_DATA)
            ? RAW_INJECTED_DATA
            : (Array.isArray(RAW_INJECTED_DATA.cards) ? RAW_INJECTED_DATA.cards : null);
          const llmRaw = !Array.isArray(RAW_INJECTED_DATA)
            ? (RAW_INJECTED_DATA.llm_response || RAW_INJECTED_DATA.llm_interpretation || RAW_INJECTED_DATA.interpretation || RAW_INJECTED_DATA.explanation || RAW_INJECTED_DATA.paragraphs)
            : null;
          const llmParas = splitLlmParagraphs(llmRaw, 10);
          if (llmParas.length > 10) {
            extraSummaryParagraphs = llmParas.slice(10);
          }
          if (rawCards && rawCards.length >= 10) {
            return rawCards.slice(0, 10).map((c, idx) => normalizeCard(c, llmParas[idx] || ''));
          }
        }
        const used = new Set();
        const fallback = [];
        while (fallback.length < 10) {
          const id = Math.floor(Math.random() * 78);
          if (!used.has(id)) {
            used.add(id);
            fallback.push({
              id: id,
              card_name: 'Card #' + id,
              is_reverse: Math.random() < 0.5,
              meaning: 'Connect your Supabase celtic_cross() and LLM interpretation output to display the reading for card ID ' + id + '.',
            });
          }
        }
        return fallback;
      }

      function escapeHtml(str) {
        return String(str == null ? '' : str)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#39;');
      }

      function getCardImageCandidates(card) {
        if (card && card.image_url) return [card.image_url];
        const file = card.id + '.png';
        return [
          '../images/card/' + file,
          CARD_IMAGE_BASE_PATH + file,
          '/static/images/card/' + file,
          'static/images/card/' + file,
        ];
      }

      function getCardBackCandidates() {
        if (RAW_INJECTED_DATA && typeof RAW_INJECTED_DATA === 'object' && !Array.isArray(RAW_INJECTED_DATA) && RAW_INJECTED_DATA.card_back_url) {
          return [RAW_INJECTED_DATA.card_back_url];
        }
        return [
          '../' + CARD_BACK_REL_PATH,
          '/app/static/' + CARD_BACK_REL_PATH,
          '/static/' + CARD_BACK_REL_PATH,
          'static/' + CARD_BACK_REL_PATH,
        ];
      }

      function setCardBackContent(backEl, uid) {
        const candidates = getCardBackCandidates();
        let idx = 0;
        backEl.innerHTML =
          '<img class="tarot-face-img" src="' + escapeHtml(candidates[0]) + '" alt="Tarot card back" draggable="false" />';
        const img = backEl.querySelector('img');
        if (img) {
          img.addEventListener('error', function () {
            idx += 1;
            if (idx < candidates.length) {
              img.src = candidates[idx];
            } else {
              backEl.innerHTML = createCardBackSvg(uid);
            }
          });
        }
      }

      function createFallbackFaceSvg(card) {
        return '<svg viewBox="0 0 200 320" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">' +
          '<rect width="200" height="320" rx="10" fill="#f7f4ec" />' +
          '<rect x="12" y="12" width="176" height="258" fill="#1e1b4b" stroke="#18181b" stroke-width="2.4" />' +
          '<circle cx="100" cy="140" r="42" fill="none" stroke="#fde047" stroke-width="2" />' +
          '<text x="100" y="146" text-anchor="middle" fill="#fef3c7" font-size="22" font-weight="700" font-family="Georgia, serif">#' + escapeHtml(card.id) + '</text>' +
          '<rect x="12" y="274" width="176" height="34" fill="#f7f4ec" stroke="#18181b" stroke-width="2.4" />' +
          '<text x="100" y="297" text-anchor="middle" fill="#18181b" font-size="13" font-weight="700" font-family="Georgia, serif">' + escapeHtml(card.card_name) + '</text>' +
        '</svg>';
      }

      function setCardFrontContent(frontEl, card) {
        const candidates = getCardImageCandidates(card);
        let idx = 0;
        const revClass = card.is_reverse ? ' is-reversed' : '';
        frontEl.innerHTML =
          '<img class="tarot-face-img' + revClass + '" src="' + escapeHtml(candidates[0]) + '" alt="' + escapeHtml(card.card_name) + '" draggable="false" />';
        const img = frontEl.querySelector('img');
        if (img) {
          img.addEventListener('error', function () {
            idx += 1;
            if (idx < candidates.length) {
              img.src = candidates[idx];
            } else {
              frontEl.innerHTML = createFallbackFaceSvg(card);
            }
          });
        }
      }

      function createCardBackSvg(uid) {
        return '<svg viewBox="0 0 200 320" preserveAspectRatio="none" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">' +
          '<defs>' +
            '<linearGradient id="bg-' + uid + '" x1="0" y1="0" x2="200" y2="320" gradientUnits="userSpaceOnUse"><stop offset="0%" stop-color="#0a070b" /><stop offset="50%" stop-color="#040306" /><stop offset="100%" stop-color="#09060b" /></linearGradient>' +
            '<linearGradient id="gd-' + uid + '" x1="20" y1="10" x2="180" y2="310" gradientUnits="userSpaceOnUse"><stop offset="0%" stop-color="#f2c47d" /><stop offset="35%" stop-color="#d48c3e" /><stop offset="68%" stop-color="#f4cb88" /><stop offset="100%" stop-color="#b8722c" /></linearGradient>' +
          '</defs>' +
          '<rect width="200" height="320" rx="10" fill="url(#bg-' + uid + ')" />' +
          '<rect x="5.5" y="5.5" width="189" height="309" rx="7.5" stroke="url(#gd-' + uid + ')" stroke-width="2.2" />' +
          '<rect x="10.5" y="10.5" width="179" height="299" rx="5" stroke="url(#gd-' + uid + ')" stroke-width="1.1" opacity="0.82" />' +
          '<g stroke="url(#gd-' + uid + ')" stroke-linecap="round" stroke-linejoin="round">' +
            '<g><path d="M16 56 C16 28,32 17,56 17 C42 22,34 31,35 44 C36 53,45 55,49 48 C52 43,47 37,42 40" stroke-width="1.5" /><path d="M184 56 C184 28,168 17,144 17 C158 22,166 31,165 44 C164 53,155 55,151 48 C148 43,153 37,158 40" stroke-width="1.5" /><path d="M100 18 C88 32,86 50,100 66 C114 50,112 32,100 18 Z" fill="#070509" stroke-width="1.6" /><path d="M100 58 C82 40,62 34,50 48 C65 49,77 59,86 78" stroke-width="1.6" /><path d="M100 58 C118 40,138 34,150 48 C135 49,123 59,114 78" stroke-width="1.6" /><path d="M100 74 C76 58,54 62,46 78 C64 74,78 82,88 100" stroke-width="1.5" /><path d="M100 74 C124 58,146 62,154 78 C136 74,122 82,112 100" stroke-width="1.5" /><path d="M100 22 L100 124" stroke-width="1.4" opacity="0.9" /></g>' +
            '<g transform="translate(0, 320) scale(1, -1)"><path d="M16 56 C16 28,32 17,56 17 C42 22,34 31,35 44 C36 53,45 55,49 48 C52 43,47 37,42 40" stroke-width="1.5" /><path d="M184 56 C184 28,168 17,144 17 C158 22,166 31,165 44 C164 53,155 55,151 48 C148 43,153 37,158 40" stroke-width="1.5" /><path d="M100 18 C88 32,86 50,100 66 C114 50,112 32,100 18 Z" fill="#070509" stroke-width="1.6" /><path d="M100 58 C82 40,62 34,50 48 C65 49,77 59,86 78" stroke-width="1.6" /><path d="M100 58 C118 40,138 34,150 48 C135 49,123 59,114 78" stroke-width="1.6" /><path d="M100 74 C76 58,54 62,46 78 C64 74,78 82,88 100" stroke-width="1.5" /><path d="M100 74 C124 58,146 62,154 78 C136 74,122 82,112 100" stroke-width="1.5" /><path d="M100 22 L100 124" stroke-width="1.4" opacity="0.9" /></g>' +
            '<ellipse cx="100" cy="160" rx="54" ry="31" fill="#060408" stroke-width="1.7" /><ellipse cx="100" cy="160" rx="34" ry="18.5" stroke-width="1.6" /><ellipse cx="100" cy="160" rx="22" ry="12.5" fill="#030204" stroke-width="1.9" /><path d="M46 160 L66 160 M134 160 L154 160 M100 129 L100 142 M100 178 L100 191" stroke-width="1.5" />' +
          '</g>' +
        '</svg>';
      }

      function buildCardSlots(count) {
        const arr = [];
        for (let i = 0; i < count; i++) {
          const angle = (i / count) * Math.PI * 2 - Math.PI / 2;
          arr.push({ dx: Math.round(Math.cos(angle) * 174), dy: Math.round(Math.sin(angle) * 84), z: Math.round(((Math.sin(angle) + 1) / 2) * count) + 1 });
        }
        return arr;
      }

      function getStackedPose(i, count, scale) {
        const mid = (count - 1) / 2;
        const stepX = Math.min(1.15, 13 / count);
        const stepY = Math.min(1.8, 20 / count);
        return { x: (i - mid) * stepX * scale, y: (mid - i) * stepY * scale, rot: i === count - 1 ? 0 : ((i % 3) - 1) * 0.55, scale: 1.06, z: i + 2 };
      }

      const clamp01 = (v) => (v < 0 ? 0 : v > 1 ? 1 : v);
      const easeOutCubic = (t) => 1 - Math.pow(1 - clamp01(t), 3);
      const easeInOutCubic = (t) => { const x = clamp01(t); return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
      const easeInQuad = (t) => { const x = clamp01(t); return x * x; };
      const easeInQuart = (t) => { const x = clamp01(t); return x * x * x * x; };
      const easeOutQuint = (t) => 1 - Math.pow(1 - clamp01(t), 5);

      function fmtCard(c) {
        return '<strong>' + escapeHtml(c.card_name) + '</strong>' + (c.is_reverse ? ' (Reversed)' : '');
      }

      function buildCelticSummary(cards) {
        if (extraSummaryParagraphs.length) {
          return renderParagraphsHtml(extraSummaryParagraphs);
        }
        const c0 = cards[0], c1 = cards[1], c2 = cards[2], c3 = cards[3], c4 = cards[4];
        const c5 = cards[5], c6 = cards[6], c7 = cards[7], c8 = cards[8], c9 = cards[9];
        return '<p>At the center of your Celtic Cross sits ' + fmtCard(c0) + ', directly crossed by ' + fmtCard(c1) +
          '. Rooted in ' + fmtCard(c2) + ' and emerging from ' + fmtCard(c3) +
          ', your conscious aim turns toward ' + fmtCard(c4) + ' as ' + fmtCard(c5) +
          ' approaches on the near horizon. With ' + fmtCard(c6) + ' shaping your stance amidst ' + fmtCard(c7) +
          ', honoring your hopes and cautions in ' + fmtCard(c8) + ' carries the cycle to its culmination in ' + fmtCard(c9) + '.</p>';
      }

      const SLOTS = buildCardSlots(CARD_COUNT);
      const MID = (CARD_COUNT - 1) / 2;
      const STAGGER_DELAY = Math.min(0.032, 0.38 / CARD_COUNT);

      const T_SHUFFLE_END = 2.25;
      const T_CIRCLE_END = 5.15;
      const T_CONVERGE_END = 6.75;
      const T_SINGULARITY_END = 8.15;

      const stage = document.getElementById('tarotStage');
      const origin = document.getElementById('cardsOrigin');
      const leftAnchor = document.getElementById('leftAnchor');
      const celticPrompt = document.getElementById('celticPrompt');
      const celticPromptText = document.getElementById('celticPromptText');
      const explanationCol = document.getElementById('explanationCol');
      const posNumTabs = document.getElementById('posNumTabs');
      const explainContent = document.getElementById('explainContent');
      const summaryBtn = document.getElementById('summaryBtn');
      const summaryWrap = document.getElementById('summaryWrap');
      const summaryBody = document.getElementById('summaryBody');
      const summaryCardsGrid = document.getElementById('summaryCardsGrid');
      const backToCrossBtn = document.getElementById('backToCrossBtn');

      const altarGlow = document.getElementById('altarGlow');
      const mandalaRing = document.getElementById('mandalaRing');
      const coreGlow = document.getElementById('coreGlow');
      const shockwaveOuter = document.getElementById('shockwaveOuter');
      const shockwaveInner = document.getElementById('shockwaveInner');
      const fusionFlash = document.getElementById('fusionFlash');
      const singularityCard = document.getElementById('singularityCard');

      loadBackgroundAnimation();
      setCardBackContent(singularityCard, 'sing');

      const cardEls = SLOTS.map((_, i) => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'tarot-card is-interactive';
        btn.innerHTML =
          '<div class="tarot-card-inner">' +
            '<div class="tarot-face tarot-face--back"></div>' +
            '<div class="tarot-face tarot-face--front" data-front="' + i + '"></div>' +
          '</div>';
        setCardBackContent(btn.querySelector('.tarot-face--back'), i);
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          handleCardClick(i);
        });
        origin.insertBefore(btn, singularityCard);
        return btn;
      });

      const tabBtns = CELTIC_CROSS_POSITIONS.map((pos, idx) => {
        const b = document.createElement('button');
        b.type = 'button';
        b.className = 'tarot-btn tarot-btn--num tarot-btn--secondary';
        b.textContent = pos.numeral;
        b.title = pos.numeral + '. ' + pos.label;
        b.disabled = true;
        b.addEventListener('click', () => {
          if (idx < revealedCount) {
            activeSlot = idx;
            phase = 'placed-left';
            summaryWrap.classList.remove('is-visible');
            explanationCol.classList.add('is-visible');
            layoutCards();
            renderExplanation();
          }
        });
        posNumTabs.appendChild(b);
        return b;
      });

      let layoutScale = 1, cardW = 92, cardH = 153, circleRadius = 220, stageW = 1024, stageH = 720;
      let isMobile = false;
      let leftRect = { x: -240, y: 0, width: 380, height: 480 };
      let phase = 'idle';
      let rafId = 0;
      let timers = [];
      let crossSettled = false;

      let drawnTen = getDrawnTen();
      let revealedCount = 0;
      let activeSlot = 0;

      function clearTimers() { timers.forEach((id) => clearTimeout(id)); timers = []; }

      function getCelticPose(slotIdx, sc, ox, oy) {
        const cw = cardW * sc;
        const ch = cardH * sc;
        const crossCx = ox - 0.68 * cw;
        const staffCx = ox + 1.84 * cw;
        switch (slotIdx) {
          case 0: return { x: crossCx, y: oy, rot: 0, z: 10 };
          case 1: return { x: crossCx, y: oy, rot: -90, z: 15 };
          case 2: return { x: crossCx, y: oy + ch * 1.1, rot: 0, z: 11 };
          case 3: return { x: crossCx - cw * 1.16, y: oy, rot: 0, z: 12 };
          case 4: return { x: crossCx, y: oy - ch * 1.1, rot: 0, z: 13 };
          case 5: return { x: crossCx + cw * 1.16, y: oy, rot: 0, z: 12 };
          case 6: return { x: staffCx, y: oy + ch * 1.56, rot: 0, z: 11 };
          case 7: return { x: staffCx, y: oy + ch * 0.52, rot: 0, z: 12 };
          case 8: return { x: staffCx, y: oy - ch * 0.52, rot: 0, z: 13 };
          default: return { x: staffCx, y: oy - ch * 1.56, rot: 0, z: 14 };
        }
      }

      function measure() {
        const rect = stage.getBoundingClientRect();
        stageW = rect.width || 1024;
        stageH = rect.height || 720;
        layoutScale = Math.max(0.54, Math.min(stageW / 540, stageH / 470, 1.2));
        cardW = Math.round(92 * layoutScale);
        cardH = Math.round(cardW * (1810 / 1086));
        isMobile = stageW < 768;
        circleRadius = Math.max(96, Math.min(stageW * 0.30, stageH * 0.29, 232));

        const oRect = origin.getBoundingClientRect();
        const cx = stageW ? oRect.left + oRect.width / 2 : rect.left + rect.width / 2;
        const cy = stageH ? oRect.top + oRect.height / 2 : rect.top + 24 + (rect.height - 56) / 2;

        const aRect = leftAnchor.getBoundingClientRect();
        leftRect = {
          x: (aRect.left + aRect.width / 2) - cx,
          y: (aRect.top + aRect.height / 2) - cy,
          width: aRect.width || 360,
          height: aRect.height || 460,
        };

        cardEls.forEach((el) => { el.style.width = cardW + 'px'; el.style.height = cardH + 'px'; });
        singularityCard.style.width = cardW + 'px';
        singularityCard.style.height = cardH + 'px';
        altarGlow.style.width = Math.round(380 * layoutScale) + 'px';
        altarGlow.style.height = Math.round(240 * layoutScale) + 'px';
        mandalaRing.style.width = Math.round(circleRadius * 2.18) + 'px';
        mandalaRing.style.height = Math.round(circleRadius * 2.18) + 'px';
        coreGlow.style.width = Math.round(280 * layoutScale) + 'px';
        coreGlow.style.height = Math.round(280 * layoutScale) + 'px';
        shockwaveOuter.style.width = Math.round(210 * layoutScale) + 'px';
        shockwaveOuter.style.height = Math.round(210 * layoutScale) + 'px';
        shockwaveInner.style.width = Math.round(180 * layoutScale) + 'px';
        shockwaveInner.style.height = Math.round(180 * layoutScale) + 'px';

        if (phase === 'idle') applyIdle();
        if (phase === 'centered-cross' || phase === 'placed-left' || phase === 'summary') layoutCards();
      }

      function layoutCards() {
        const centeredScale = Math.min(
          isMobile ? 0.88 : 0.96,
          Math.max(0.46, (stageH - 120) / (cardH * 4.25)),
          Math.max(0.46, (stageW - 48) / (cardW * 4.85))
        );
        const placedScale = Math.min(
          centeredScale * 0.9,
          Math.max(0.36, leftRect.width / (cardW * 4.78)),
          Math.max(0.36, leftRect.height / (cardH * 4.28))
        );
        const wingScale = isMobile
          ? Math.min(0.9, stageW / 460)
          : Math.min(1.42, Math.max(0.95, stageW / 820));
        const wingX = isMobile ? Math.min(155, stageW * 0.34) : Math.min(395, stageW * 0.36);

        cardEls.forEach((el, i) => {
          const isCeltic = i < 10;
          let tx = 0, ty = 0, rot = 0, sc = 1, op = 1, z = i + 2;

          el.classList.remove('is-next-glow', 'is-active-card');
          el.style.transitionDelay = phase === 'centered-cross' && !crossSettled ? Math.min(i * 42, 380) + 'ms' : '0ms';

          if (!isCeltic) {
            tx = (i % 2 === 0 ? -1 : 1) * 40;
            ty = 90 * layoutScale;
            rot = ((i % 3) - 1) * 8;
            sc = 0.65;
            op = 0;
            z = 1;
            el.classList.remove('is-interactive');
          } else if (phase === 'centered-cross') {
            const pose = getCelticPose(i, centeredScale, 0, 0);
            const isNext = i === revealedCount;
            tx = pose.x; ty = pose.y; rot = pose.rot;
            sc = centeredScale * (isNext ? 1.05 : 1);
            z = pose.z;
            if (isNext) el.classList.add('is-next-glow');
            el.classList.toggle('is-interactive', isNext);
          } else if (phase === 'placed-left') {
            const pose = getCelticPose(i, placedScale, leftRect.x, leftRect.y);
            const isFlipped = i < revealedCount;
            const isNext = i === revealedCount;
            const isActive = isFlipped && activeSlot === i;
            tx = pose.x; ty = pose.y; rot = pose.rot;
            sc = placedScale * (isActive ? 1.09 : isNext ? 1.06 : 1);
            z = isNext ? 48 : isActive ? 44 : pose.z;
            if (isNext) el.classList.add('is-next-glow');
            if (isActive) el.classList.add('is-active-card');
            el.classList.toggle('is-interactive', isNext || isFlipped);
          } else if (phase === 'summary') {
            const isLeftWing = i < 5;
            const step = isLeftWing ? i : 9 - i;
            const stepX = (isMobile ? 16 : 22) * wingScale;
            const stepY = (isMobile ? 28 : 42) * wingScale;
            const baseY = isMobile ? -115 : -82;
            tx = isLeftWing ? -wingX + step * stepX : wingX - step * stepX;
            ty = baseY + step * stepY;
            rot = 0;
            sc = wingScale;
            z = 38 - step * 2;
            el.classList.add('is-interactive');
          }

          el.style.transform = 'translate3d(' + tx.toFixed(1) + 'px, ' + ty.toFixed(1) + 'px, 0) rotate(' + rot.toFixed(1) + 'deg) scale(' + sc.toFixed(3) + ')';
          el.style.opacity = String(op);
          el.style.zIndex = String(z);
        });
      }

      function renderExplanation() {
        tabBtns.forEach((btn, idx) => {
          const unlocked = idx < revealedCount;
          const isNext = idx === revealedCount;
          btn.disabled = !unlocked;
          btn.className = 'tarot-btn tarot-btn--num ' + (
            unlocked && activeSlot === idx ? 'tarot-btn--primary'
              : unlocked ? 'tarot-btn--secondary'
              : isNext ? 'tarot-btn--next' : 'tarot-btn--secondary'
          );
        });

        summaryBtn.style.display = revealedCount === 10 ? 'inline-flex' : 'none';

        if (phase === 'summary') {
          summaryBody.innerHTML = buildCelticSummary(drawnTen);
          summaryCardsGrid.innerHTML = '';
          drawnTen.forEach((c, idx) => {
            const pos = CELTIC_CROSS_POSITIONS[idx];
            const orient = c.is_reverse ? 'Reversed' : 'Upright';
            const b = document.createElement('button');
            b.type = 'button';
            b.className = 'summary-10-btn';
            b.innerHTML =
              '<div class="summary-10-pos">' + pos.numeral + '. ' + pos.label + '</div>' +
              '<div class="summary-10-name">' + escapeHtml(c.card_name) + '</div>' +
              '<div class="summary-10-orient' + (c.is_reverse ? ' is-reversed' : '') + '">' + orient + '</div>';
            b.addEventListener('click', () => {
              activeSlot = idx;
              phase = 'placed-left';
              summaryWrap.classList.remove('is-visible');
              explanationCol.classList.add('is-visible');
              layoutCards();
              renderExplanation();
            });
            summaryCardsGrid.appendChild(b);
          });
          return;
        }

        const card = drawnTen[activeSlot];
        const pos = CELTIC_CROSS_POSITIONS[activeSlot];
        const orient = card.is_reverse ? 'Reversed' : 'Upright';
        const nextPos = CELTIC_CROSS_POSITIONS[Math.min(revealedCount, 9)];
        const hint = revealedCount < 10
          ? '<p class="explain-hint">Next (' + (revealedCount + 1) + ' / 10): Click the glowing ' + nextPos.numeral + '. ' + nextPos.label + ' card on the Celtic Cross.</p>'
          : '<p class="explain-hint" style="color:#c7d2fe;">All 10 cards revealed · Click any card or tab to re-read, or open Summary.</p>';

        explainContent.innerHTML =
          '<div style="margin-top:16px;">' +
            '<div class="explain-header" style="border-bottom:0; padding-bottom:0;">' +
              '<h2 class="explain-card-name">' + escapeHtml(card.card_name) + '</h2>' +
              '<span class="explain-archetype' + (card.is_reverse ? ' is-reversed' : '') + '">' + pos.numeral + '. ' + pos.label + ' — ' + pos.subtitle + ' · ' + orient + '</span>' +
            '</div>' +
            '<div class="explain-body">' + renderParagraphsHtml(card.meaning) + '</div>' +
            hint +
          '</div>';
      }

      function openCelticCross() {
        clearTimers();
        cancelAnimationFrame(rafId);
        phase = 'centered-cross';
        crossSettled = false;
        revealedCount = 0;
        activeSlot = 0;
        drawnTen = getDrawnTen();

        for (let i = 0; i < 10; i++) {
          setCardFrontContent(cardEls[i].querySelector('[data-front]'), drawnTen[i]);
        }

        altarGlow.style.opacity = '0';
        mandalaRing.style.opacity = '0';
        coreGlow.style.opacity = '0';
        shockwaveOuter.style.opacity = '0';
        shockwaveInner.style.opacity = '0';
        fusionFlash.style.opacity = '0';
        singularityCard.style.opacity = '0';
        singularityCard.style.visibility = 'hidden';

        explanationCol.classList.remove('is-visible');
        summaryWrap.classList.remove('is-visible');
        celticPromptText.innerHTML = 'Click the glowing <strong>I. Present</strong> card at the heart of the cross';
        celticPrompt.classList.add('is-visible');

        cardEls.forEach((el) => el.classList.add('tarot-glide'));
        requestAnimationFrame(() => {
          measure();
          requestAnimationFrame(() => {
            layoutCards();
            timers.push(setTimeout(() => { crossSettled = true; }, 820));
          });
        });
      }

      function handleCardClick(idx) {
        if (phase === 'idle') { startRitual(); return; }
        if (phase === 'deck') { openCelticCross(); return; }
        if (idx >= 10) return;

        if (idx >= revealedCount) {
          if (idx === revealedCount) {
            cardEls[idx].classList.add('is-flipped');
            revealedCount++;
            activeSlot = idx;
            if (phase === 'centered-cross') {
              phase = 'placed-left';
              celticPrompt.classList.remove('is-visible');
              measure();
              timers.push(setTimeout(() => explanationCol.classList.add('is-visible'), 300));
            }
            layoutCards();
            renderExplanation();
          }
          return;
        }

        activeSlot = idx;
        if (phase === 'summary') {
          phase = 'placed-left';
          summaryWrap.classList.remove('is-visible');
          timers.push(setTimeout(() => explanationCol.classList.add('is-visible'), 260));
        }
        layoutCards();
        renderExplanation();
      }

      summaryBtn.addEventListener('click', () => {
        if (revealedCount === 10) {
          phase = 'summary';
          explanationCol.classList.remove('is-visible');
          layoutCards();
          renderExplanation();
          timers.push(setTimeout(() => summaryWrap.classList.add('is-visible'), 260));
        }
      });

      backToCrossBtn.addEventListener('click', () => {
        phase = 'placed-left';
        summaryWrap.classList.remove('is-visible');
        layoutCards();
        renderExplanation();
        timers.push(setTimeout(() => explanationCol.classList.add('is-visible'), 260));
      });

      function applyIdle() {
        clearTimers();
        cancelAnimationFrame(rafId);
        phase = 'idle';
        revealedCount = 0;
        activeSlot = 0;
        stage.classList.add('is-click-to-shuffle');
        celticPrompt.classList.remove('is-visible');
        explanationCol.classList.remove('is-visible');
        summaryWrap.classList.remove('is-visible');
        SLOTS.forEach((slot, i) => {
          const el = cardEls[i];
          el.style.transitionDelay = '0ms';
          el.classList.remove('tarot-glide', 'is-flipped', 'is-next-glow', 'is-active-card');
          el.classList.add('is-interactive');
          el.style.transform = 'translate3d(' + (slot.dx * layoutScale) + 'px, ' + (slot.dy * layoutScale) + 'px, 0) rotate(0deg) scale(1)';
          el.style.opacity = '1';
          el.style.zIndex = String(slot.z);
        });
        altarGlow.style.opacity = '1';
        altarGlow.style.transform = 'translateY(' + Math.round(118 * layoutScale) + 'px)';
        mandalaRing.style.opacity = '0';
        coreGlow.style.opacity = '0';
        shockwaveOuter.style.opacity = '0';
        shockwaveInner.style.opacity = '0';
        fusionFlash.style.opacity = '0';
        singularityCard.style.opacity = '0';
      }

      function startRitual() {
        if (phase !== 'idle') return;
        clearTimers();
        cancelAnimationFrame(rafId);
        phase = 'shuffling';
        revealedCount = 0;
        activeSlot = 0;
        stage.classList.remove('is-click-to-shuffle');
        celticPrompt.classList.remove('is-visible');
        explanationCol.classList.remove('is-visible');
        summaryWrap.classList.remove('is-visible');
        singularityCard.style.opacity = '0';
        singularityCard.style.visibility = 'visible';
        cardEls.forEach((el) => {
          el.style.transitionDelay = '0ms';
          el.classList.remove('tarot-glide', 'is-flipped', 'is-next-glow', 'is-active-card', 'is-interactive');
        });

        let lastTs = performance.now();
        let elapsed = 0;

        function tick(now) {
          const dt = Math.min((now - lastTs) / 1000, 0.05);
          lastTs = now;
          elapsed += dt;

          if (elapsed < T_SHUFFLE_END) {
            const t = elapsed;
            const halfRank = Math.max(1, Math.floor(CARD_COUNT / 4));
            SLOTS.forEach((slot, i) => {
              const el = cardEls[i];
              const sx = slot.dx * layoutScale, sy = slot.dy * layoutScale;
              const side = i % 2 === 0 ? -1 : 1, rank = Math.floor(i / 2);
              let x = 0, y = 0, rot = 0, sc = 1, z = slot.z;
              if (t < 0.42) {
                const u = easeOutCubic(t / 0.42);
                x = sx + (side * (95 + (rank % 6) * 18) * layoutScale - sx) * u;
                y = sy + ((rank - halfRank) * Math.min(14, 70 / CARD_COUNT) * layoutScale - sy) * u;
                rot = side * (11 + (rank % 6) * 3.2) * u; sc = 1 + 0.04 * u; z = i + 2;
              } else if (t < 1.8) {
                const p = (t - 0.42) / 1.38;
                const env = Math.sin(Math.min(1, p * 1.15) * Math.PI * 0.5) * (1 - 0.25 * p);
                const wp = p * Math.PI * 3 + i * (3.12 / CARD_COUNT), sweep = Math.cos(wp);
                x = side * sweep * (128 + (i % 3) * 24) * layoutScale * (0.45 + 0.55 * env);
                y = Math.sin(wp * 2) * 28 * layoutScale + (rank - halfRank) * 4 * layoutScale * (1 - p);
                rot = side * sweep * 17; sc = 1.04 + 0.04 * Math.abs(Math.sin(wp));
                z = Math.round(CARD_COUNT * 0.6 + Math.sin(wp) * (CARD_COUNT * 0.5));
              } else {
                const u = easeInOutCubic((t - 1.8) / 0.45);
                const we = Math.PI * 3 + i * (3.12 / CARD_COUNT), se = Math.cos(we);
                const fx = side * se * (128 + (i % 3) * 24) * layoutScale * 0.86;
                const fy = Math.sin(we * 2) * 28 * layoutScale;
                x = fx * (1 - u) + (1 - u) * Math.sin(t * 48 + i * 1.7) * 2.5 * layoutScale;
                y = fy * (1 - u) + (i - MID) * 0.35 * (1 - u);
                rot = side * se * 17 * (1 - u) + (i - MID) * 0.7 * (1 - u);
                sc = 1.04 - 0.04 * u; z = i + 1;
              }
              el.style.transform = 'translate3d(' + x.toFixed(2) + 'px, ' + y.toFixed(2) + 'px, 0) rotate(' + rot.toFixed(2) + 'deg) scale(' + sc.toFixed(3) + ')';
              el.style.opacity = '1'; el.style.zIndex = String(z);
            });
            altarGlow.style.opacity = clamp01(1 - elapsed / 1.4).toFixed(3);
            const g = elapsed > 1.7 ? clamp01((elapsed - 1.7) / 0.55) : 0;
            coreGlow.style.opacity = (g * 0.55).toFixed(3);
            coreGlow.style.transform = 'scale(' + (0.35 + g * 0.35).toFixed(3) + ')';
          } else if (elapsed < T_CIRCLE_END) {
            if (phase !== 'circle') { phase = 'circle'; }
            const tau = elapsed - T_SHUFFLE_END;
            const bloomU = clamp01(tau / 0.85), r = circleRadius * easeOutQuint(bloomU);
            const theta = 0.35 * tau + 0.38 * tau * tau, rb = easeOutCubic(clamp01(tau / 0.5));
            SLOTS.forEach((_, i) => {
              const ang = (i / CARD_COUNT) * Math.PI * 2 - Math.PI / 2 + theta;
              const deg = ((ang * 180) / Math.PI + 90) * rb;
              cardEls[i].style.transform = 'translate3d(' + (r * Math.cos(ang)).toFixed(2) + 'px, ' + (r * Math.sin(ang)).toFixed(2) + 'px, 0) rotate(' + deg.toFixed(2) + 'deg) scale(1)';
              cardEls[i].style.opacity = '1'; cardEls[i].style.zIndex = String(i + 2);
            });
            mandalaRing.style.opacity = (easeOutCubic(clamp01(tau / 0.75)) * 0.85).toFixed(3);
            mandalaRing.style.transform = 'scale(' + (0.35 + 0.65 * easeOutQuint(bloomU)).toFixed(3) + ') rotate(' + (-(theta * 180) / Math.PI * 0.55).toFixed(2) + 'deg)';
            coreGlow.style.opacity = (0.42 + 0.14 * Math.sin(tau * 4)).toFixed(3);
          } else if (elapsed < T_CONVERGE_END) {
            if (phase !== 'converging') { phase = 'converging'; }
            const dur = T_CONVERGE_END - T_CIRCLE_END, s = clamp01((elapsed - T_CIRCLE_END) / dur);
            const cd = T_CIRCLE_END - T_SHUFFLE_END, t0 = 0.35 * cd + 0.38 * cd * cd, w0 = 0.35 + 0.76 * cd;
            const theta = t0 + dur * (w0 * s + 6.2 * Math.pow(s, 2.35));
            const r = circleRadius * (1 - easeInQuart(s)), sc = 1 - 0.16 * easeInQuad(s);
            const op = s > 0.9 ? clamp01(1 - (s - 0.9) / 0.1) : 1;
            SLOTS.forEach((_, i) => {
              const ang = (i / CARD_COUNT) * Math.PI * 2 - Math.PI / 2 + theta;
              const deg = (ang * 180) / Math.PI + 90;
              cardEls[i].style.transform = 'translate3d(' + (r * Math.cos(ang)).toFixed(2) + 'px, ' + (r * Math.sin(ang)).toFixed(2) + 'px, 0) rotate(' + deg.toFixed(2) + 'deg) scale(' + sc.toFixed(3) + ')';
              cardEls[i].style.opacity = op.toFixed(3);
            });
            mandalaRing.style.opacity = (0.85 * (1 - easeInQuad(s))).toFixed(3);
            mandalaRing.style.transform = 'scale(' + Math.max(0.05, 1 - 0.88 * easeInQuart(s)).toFixed(3) + ')';
            coreGlow.style.opacity = (0.5 + 0.5 * easeInQuad(s)).toFixed(3);
            coreGlow.style.transform = 'scale(' + (0.7 + 0.85 * easeInQuart(s)).toFixed(3) + ')';
          } else if (elapsed < T_SINGULARITY_END) {
            if (phase !== 'singularity') { phase = 'singularity'; }
            const post = elapsed - T_CONVERGE_END;
            if (post < 0.1) cardEls.forEach((el) => { el.style.opacity = '0'; });
            mandalaRing.style.opacity = '0';
            const sw = clamp01(post / 1.05);
            shockwaveOuter.style.opacity = (sw < 1 ? (1 - sw) * 0.92 : 0).toFixed(3);
            shockwaveOuter.style.transform = 'scale(' + (0.15 + 3.1 * easeOutQuint(sw)).toFixed(3) + ')';
            const sw2 = clamp01((post - 0.08) / 0.85);
            shockwaveInner.style.opacity = (post > 0.08 && sw2 < 1 ? (1 - sw2) * 0.75 : 0).toFixed(3);
            shockwaveInner.style.transform = 'scale(' + (0.12 + 2.2 * easeOutCubic(sw2)).toFixed(3) + ')';
            const fl = clamp01(post / 0.55);
            fusionFlash.style.opacity = (fl < 1 ? Math.pow(1 - fl, 2) * 0.85 : 0).toFixed(3);
            const em = easeOutQuint(clamp01(post / 0.45));
            singularityCard.style.opacity = em.toFixed(3);
            singularityCard.style.transform = 'translate3d(0, ' + (Math.sin(post * 2.2) * 5 * layoutScale).toFixed(2) + 'px, 0) scale(' + (0.72 + 0.50 * em).toFixed(3) + ')';
          } else {
            if (phase !== 'deck') {
              phase = 'deck';
              cardEls.forEach((el) => el.classList.add('is-interactive'));
            }
            const pd = elapsed - T_SINGULARITY_END;
            shockwaveOuter.style.opacity = '0';
            shockwaveInner.style.opacity = '0';
            fusionFlash.style.opacity = '0';
            singularityCard.style.opacity = clamp01(1 - pd / 0.32).toFixed(3);
            const cf = easeOutCubic(clamp01(pd / 0.85));
            coreGlow.style.opacity = (0.75 * (1 - cf) + 0.24 * cf).toFixed(3);
            coreGlow.style.transform = 'scale(' + (1.15 - 0.25 * cf).toFixed(3) + ')';

            SLOTS.forEach((_, i) => {
              const d = i * STAGGER_DELAY;
              const u = easeOutQuint(clamp01((pd - d) / 0.56));
              const ap = clamp01((pd - d * 0.5) / 0.18);
              const pose = getStackedPose(i, CARD_COUNT, layoutScale);
              const x = pose.x * u;
              const y = (-18 * layoutScale) * (1 - u) + pose.y * u;
              const rot = pose.rot * u;
              cardEls[i].style.transform = 'translate3d(' + x.toFixed(2) + 'px, ' + y.toFixed(2) + 'px, 0) rotate(' + rot.toFixed(2) + 'deg) scale(' + (1.22 - 0.16 * u).toFixed(3) + ')';
              cardEls[i].style.opacity = ap.toFixed(3);
              cardEls[i].style.zIndex = String(pose.z);
            });

            if (pd > 1.08) {
              openCelticCross();
              return;
            }
          }

          rafId = requestAnimationFrame(tick);
        }

        rafId = requestAnimationFrame(tick);
      }

      document.addEventListener('click', () => {
        if (phase === 'idle') startRitual();
      });

      window.addEventListener('resize', measure);
      if (window.ResizeObserver) new ResizeObserver(measure).observe(stage);
      measure();
    })();

    //
  </script>
</body>
</html>
